---
- name: Instalar Python y herramientas adicionales en VM2
  hosts: all
  become: true
  tasks:
    - name: Actualizar la lista de paquetes (apt update)
      ansible.builtin.apt:
        update_cache: yes

    - name: Instalar Python3, pip y venv
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
